[project]
name = "campus-framework"
version = "0.1.0"
description = "Local web framework with shared authentication, AI and independent modules"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.13",
  "httpx>=0.28",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "cryptography>=44",
  "filelock>=3",
  "shanghaitech-ids-passkey @ git+https://github.com/vvbbnn00/shanghaitech-ids-passkey.git@7c4df62716ceb3d94452d22f3d07f19ff1b8db8b",
  "deepseek-harness-sdk==0.1.5rc1",
  "pypdf>=6.20.1",
  "tzdata>=2025.2; sys_platform == 'win32'",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://mirrors.nju.edu.cn/pypi/web/simple"
default = true
