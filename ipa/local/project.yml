name: campusMateLocal
options:
  bundleIdPrefix: edu.shanghaitech
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  campusMateLocal:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - boot.py
          - PythonBridge.h
    settings:
      base:
        PRODUCT_NAME: campusMateLocal
        PRODUCT_BUNDLE_IDENTIFIER: edu.shanghaitech.campusmate.local
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: Sources/PythonBridge.h
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/Python.xcframework/ios-arm64
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - framework: Python.xcframework
        embed: true
    postCompileScripts:
      - name: Bundle the CPython standard library and the web workspace
        script: |
          set -euo pipefail
          BUNDLE="$CODESIGNING_FOLDER_PATH"
          mkdir -p "$BUNDLE/python/lib"
          rsync -a --delete "$SRCROOT/Python.xcframework/lib/" "$BUNDLE/python/lib/" --exclude 'libpython*.dylib'
          rsync -a "$SRCROOT/Python.xcframework/ios-arm64/lib-arm64/" "$BUNDLE/python/lib/"
          rsync -a --delete "$SRCROOT/../../web/" "$BUNDLE/web/"
          cp "$SRCROOT/Sources/boot.py" "$BUNDLE/boot.py"
schemes:
  campusMateLocal:
    build:
      targets:
        campusMateLocal: all
    archive:
      config: Release
