<!doctype html>
<html lang="zh-CN" data-ui-theme="nord-refined">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2e3440">
  <meta name="description" content="按功能安装和管理独立模块的本地工作台。">
  <title>校园工作台</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
  <!-- Theme overrides stay separate from shared component styles. -->
  <link rel="stylesheet" href="/assets/themes/nord-refined.css">
  <link rel="stylesheet" href="/assets/opening-lines.css">
  <script type="module" src="/assets/opening-lines.js"></script>
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <aside class="sidebar" id="sidebar" aria-label="工作台导航">
    <a class="brand" href="#"><img src="/assets/icon.svg" alt=""><span>校园工作台</span></a>
    <nav id="navigation" aria-label="主导航"></nav>
  </aside>
  <button class="menu-scrim" id="menu-scrim" type="button" aria-label="关闭导航" hidden></button>
  <div class="shell">
    <header class="topbar">
      <button class="icon-button mobile-only" id="mobile-menu" type="button" aria-label="展开导航" aria-controls="sidebar" aria-expanded="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <strong id="page-label" class="mobile-only">校园工作台</strong><span id="workspace-date"></span>
      <p class="opening-line" role="note" aria-label="开场白" data-opening-line>知识没有尽头，浏览器的内存有。</p>
    </header>
    <main id="main" tabindex="-1"><div class="loading" role="status"><span class="spinner" aria-hidden="true"></span>正在打开工作台…</div></main>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
