<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2e3440">
  <meta name="description" content="按功能安装和管理独立模块的本地工作台。">
  <title>校园工作台</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <aside class="sidebar" id="sidebar" aria-label="工作台导航">
    <a class="brand" href="#"><img src="/assets/icon.svg" alt=""><span>校园工作台</span></a>
    <nav id="navigation" aria-label="主导航"></nav>
  </aside>
  <button class="menu-scrim" id="menu-scrim" type="button" aria-label="关闭导航" hidden></button>
  <div class="shell">
    <header class="topbar">
      <button class="icon-button mobile-only" id="mobile-menu" type="button" aria-label="展开导航" aria-controls="sidebar" aria-expanded="false">☰</button>
      <strong id="page-label" class="mobile-only">校园工作台</strong><span id="workspace-date"></span>
    </header>
    <main id="main" tabindex="-1"><div class="loading" role="status"><span class="spinner" aria-hidden="true"></span>正在打开工作台…</div></main>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
