name: iOS shell

# The iPhone client is a thin WKWebView shell; this job proves the project still
# builds on a Mac and uploads the unsigned campusMate.ipa as an artifact, so a
# machine without Xcode can still get the build output.
on:
  workflow_dispatch:
  push:
    paths:
      - 'ipa/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ipa/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unsigned device build
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ipa
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Build the shell and zip an unsigned IPA
        run: ./build_ipa.sh
      - name: Upload the unsigned IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: campusMate-ipa
          path: ipa/campusMate.ipa
          if-no-files-found: error
